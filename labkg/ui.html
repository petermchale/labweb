<div id="labkg-evidence">
  <h3>Project evidence graph</h3>
  <div class="viz-controls"><label class="form-label">Relationship<select class="form-select" data-role="edge"></select></label></div>
  <div class="kg-flow" role="group" aria-label="Selected graph relationship">
    <div data-role="subject"></div><div class="text-small" data-role="predicate"></div><div data-role="object"></div>
  </div>
  <div aria-live="polite">
    <p class="text-small" data-role="provenance"></p>
    <pre><code data-role="quote"></code></pre>
  </div>
</div>
<style>
#labkg-evidence .kg-flow {display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;margin:24px 0}
#labkg-evidence .kg-flow > div {overflow-wrap:anywhere}
#labkg-evidence .kg-flow > div:first-child,#labkg-evidence .kg-flow > div:last-child {padding:16px;background:color-mix(in srgb,var(--viz-series-1) 12%,transparent)}
#labkg-evidence pre {white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:500px){#labkg-evidence .kg-flow {grid-template-columns:minmax(0,1fr);gap:12px}}
</style>
<script type="application/json" id="labkg-data">__DATA__</script>
<script>
(() => {
 const root=document.getElementById('labkg-evidence');
 const data=JSON.parse(document.getElementById('labkg-data').textContent);
 if(data.contract!=='labkg.ui/v1'||data.component!=='EvidenceGraph') throw new Error('Unsupported component');
 const label=s=>decodeURIComponent(s.split('/').pop()).replace('non-longitudinal:','');
 const edges=data.edges.filter(e=>/\/(sample|family|father|mother|sequenced|center)$/.test(e.predicate));
 const choices=edges.length?edges:data.edges.slice(0,12);
 const select=root.querySelector('[data-role=edge]');
 for(const [i,e] of choices.entries()) {const option=document.createElement('option');option.value=i;option.textContent=label(e.subject)+' → '+label(e.predicate)+' → '+label(e.object);select.append(option)}
 const show=()=>{
  const e=choices[Number(select.value)];if(!e)return;
  root.querySelector('[data-role=subject]').textContent=label(e.subject);
  root.querySelector('[data-role=predicate]').textContent='→ '+label(e.predicate)+' →';
  root.querySelector('[data-role=object]').textContent=label(e.object);
  root.querySelector('[data-role=provenance]').textContent=e.status+' · '+e.method+' · line '+e.line;
  root.querySelector('[data-role=quote]').textContent=e.evidence||'Evidence remains available in the cited source revision.';
 };
 select.addEventListener('change',show);show();
})();
</script>
